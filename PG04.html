<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Orientador</title>
    <style>
        /* Reset básico e fonte parecida com a da imagem */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Cabeçalho superior */
        header {
            background-color: #ededed;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #e0e0e0;
        }

        .perfil-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Ícone de perfil verde */
        .avatar {
            width: 42px;
            height: 42px;
            background-color: #43a047;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar svg {
            width: 34px;
            height: 34px;
            fill: #ffffff;
        }

        .nome-contato {
            font-size: 22px;
            color: #546e7a;
            letter-spacing: 2px;
            font-weight: 400;
        }

        /* Ícones da direita (Telefone e Menu) */
        .acoes-header {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .btn-icone {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .btn-icone:hover {
            background-color: #e0e0e0;
        }

        .btn-icone svg {
            fill: #43a047;
        }

        /* Área onde as mensagens aparecem */
        .area-mensagens {
            flex: 1;
            padding: 25px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #ffffff;
        }

        /* Estilo dos balões de mensagem */
        .mensagem {
            max-width: 65%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .mensagem.enviada {
            align-self: flex-end;
            background-color: #43a047;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .mensagem.recebida {
            align-self: flex-start;
            background-color: #ededed;
            color: #37474f;
            border-bottom-left-radius: 4px;
        }

        .hora-msg {
            font-size: 11px;
            opacity: 0.75;
            display: block;
            text-align: right;
            margin-top: 4px;
        }

        /* Área inferior de digitação */
        footer {
            padding: 10px 25px 18px 25px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .input-container {
            width: 100%;
            background-color: #ededed;
            border-radius: 25px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 17px;
            color: #455a64;
            letter-spacing: 1px;
        }

        .input-container input::placeholder {
            color: #607d8b;
            letter-spacing: 1.5px;
        }

        /* Botão verde "enviar" */
        .btn-enviar {
            margin-top: 8px;
            margin-right: 45px;
            background-color: #43a047;
            color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 4px 22px;
            font-size: 13px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-enviar:hover {
            background-color: #388e3c;
        }

        .btn-enviar:active {
            transform: scale(0.96);
        }

        .botoes{
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="perfil-info">
            <div class="avatar">
                <!-- Ícone de usuário -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <span class="nome-contato">Orientador</span>
        </div>

        <div class="acoes-header">
            <!-- Ícone de telefone -->
            <button class="btn-icone" title="Ligar" onclick="alert('Iniciando chamada com o Orientador...')">
                <svg width="26" height="26" viewBox="0 0 24 24">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
            </button>

            <!-- Ícone de três pontinhos -->
            <button class="btn-icone" title="Mais opções" onclick="limparChat()">
                <svg width="26" height="26" viewBox="0 0 24 24">
                    <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Área onde as mensagens serão exibidas -->
    <main class="area-mensagens" id="chat-box"></main>

    <!-- Rodapé com campo de texto e botão enviar -->
    <footer>
        <div class="input-container">
            <input type="text" id="campo-mensagem" placeholder="Digite sua mensagem..." autocomplete="off">
        </div>
        <div class="botoes">
            <button class="btn-enviar" id="botao-enviar">enviar</button>
            <button onclick="next()" class="btn-enviar" id="botao-enviar">></button>
        </div>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const campoMensagem = document.getElementById('campo-mensagem');
        const botaoEnviar = document.getElementById('botao-enviar');

        // Função para pegar a hora atual formatada (ex: 14:30)
        function obterHoraAtual() {
            const agora = new Date();
            return agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        // Função que cria o balão da mensagem na tela
        function adicionarMensagemNaTela(texto, tipo) {
            const divMensagem = document.createElement('div');
            divMensagem.classList.add('mensagem', tipo);

            const spanTexto = document.createElement('span');
            spanTexto.textContent = texto;

            const spanHora = document.createElement('span');
            spanHora.classList.add('hora-msg');
            spanHora.textContent = obterHoraAtual();

            divMensagem.appendChild(spanTexto);
            divMensagem.appendChild(spanHora);
            chatBox.appendChild(divMensagem);

            // Rola automaticamente para a última mensagem
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Função principal para enviar a mensagem
        function enviarMensagem() {
            const texto = campoMensagem.value.trim();

            if (texto === '') return; // Não envia se estiver vazio

            // Adiciona a mensagem do usuário
            adicionarMensagemNaTela(texto, 'enviada');

            // Limpa o campo de texto e mantém o foco nele
            campoMensagem.value = '';
            campoMensagem.focus();

            // Simulação opcional de resposta automática do Orientador após 1 segundo
            setTimeout(() => {
                adicionarMensagemNaTela('Mensagem recebida! Em breve o orientador responderá.', 'recebida');
            }, 1000);
        }

        // Evento de clique no botão "enviar"
        botaoEnviar.addEventListener('click', enviarMensagem);

        // Evento para enviar ao apertar a tecla "Enter"
        campoMensagem.addEventListener('keypress', function(evento) {
            if (evento.key === 'Enter') {
                enviarMensagem();
            }
        });

        // Função extra nos três pontinhos para limpar a conversa
        function limparChat() {
            if (confirm('Deseja limpar o histórico de mensagens?')) {
                chatBox.innerHTML = '';
            }
        }

        function next(){
            window.location.href = "PG05.html"
        }
    </script>

</body>
</html>
