<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Orientador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Cabeçalho superior */
    .header {
      background-color: #f3f3f3;
      height: 70px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e6e6e6;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Ícone de perfil verde */
    .avatar {
      width: 44px;
      height: 44px;
      background-color: #48a842;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
    }

    .user-name {
      font-size: 24px;
      color: #5b6370;
      font-weight: 400;
      letter-spacing: 2px;
    }

    /* Ícones da direita (telefone e menu) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .icon-btn svg {
      fill: #48a842;
    }

    /* Área central das mensagens */
    .chat-area {
      flex: 1;
      background-color: #ffffff;
      padding: 20px;
      overflow-y: auto;
    }

    /* Área inferior de digitação */
    .footer {
      padding: 12px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      background-color: #ffffff;
    }

    .message-input {
      width: 100%;
      background-color: #e9e9e9;
      border: none;
      border-radius: 25px;
      padding: 14px 24px;
      font-size: 18px;
      color: #4a5568;
      letter-spacing: 1.5px;
      outline: none;
    }

    .message-input::placeholder {
      color: #6b7280;
    }

    .send-btn {
      background-color: #48a842;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 4px 22px;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      margin-right: 45px;
      transition: background-color 0.2s;
    }

    .send-btn:hover {
      background-color: #3d9138;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <div class="user-info">
      <div class="avatar">
        <!-- Ícone de usuário -->
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
        </svg>
      </div>
      <span class="user-name">Orientador</span>
    </div>

    <div class="header-actions">
      <!-- Ícone de telefone -->
      <button class="icon-btn" title="Ligar">
        <svg width="28" height="28" viewBox="0 0 24 24">
          <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
      </button>

      <!-- Ícone de três pontos -->
      <button class="icon-btn" title="Mais opções">
        <svg width="28" height="28" viewBox="0 0 24 24">
          <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Área onde as mensagens aparecem -->
  <main class="chat-area"></main>

  <!-- Campo de texto e botão enviar -->
  <footer class="footer">
    <input type="text" class="message-input" placeholder="Digite sua mensagem...">
    <button class="send-btn">enviar</button>
  </footer>

</body>
</html>
